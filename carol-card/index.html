<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>洪彣欣 Carol｜Carewell 怡東顧問</title>
<meta name="description" content="洪彣欣 Carol｜怡東人事顧問股份有限公司 董事總經理／商周專欄作家">
<style>
:root{--navy:#0b3f78;--gray:#54565a;--line:#e6e8eb;--teal:#2d9da2;--yellow:#f2b126;--bg:#f6f7f9}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--gray)}
body{min-height:100vh;padding:24px 14px 40px}
.wrap{max-width:560px;margin:0 auto}
.card{background:#fff;border-radius:28px;box-shadow:0 14px 40px rgba(15,40,70,.09);padding:34px 28px 26px;border:1px solid #eef0f2}
.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}
.identity{min-width:0;flex:1 1 auto}
.name-cn{font-size:34px;letter-spacing:.10em;font-weight:500;color:#5b5d60;line-height:1.15;white-space:nowrap}
.name-en{margin-top:9px;font-size:18px;letter-spacing:.18em;color:#56585c;white-space:nowrap}
.role{margin-top:18px;font-size:20px;letter-spacing:.12em;line-height:1.5;white-space:nowrap}
.brand-lockup{width:178px;flex:0 0 178px;display:flex;flex-direction:column;align-items:stretch}
.logo-img{display:block;width:100%;height:auto;object-fit:contain}
.brand-zh{margin-top:5px;width:100%;display:flex;justify-content:space-between;align-items:center;color:#5b5d60;font-size:18px;font-weight:400;line-height:1.15;white-space:nowrap}
.brand-zh span{display:block}
.profile-photo{display:block;width:156px;height:156px;object-fit:cover;object-position:center 32%;border-radius:22px;margin:22px auto 4px;box-shadow:0 8px 24px rgba(15,40,70,.12)}
.divider{height:1px;background:var(--line);margin:28px 0 22px}
.contact{display:grid;gap:10px;font-size:17px;line-height:1.4}
.contact a{color:inherit;text-decoration:none}
.label{font-weight:700;color:#4d4f53;min-width:70px;display:inline-block}
.website{margin-top:18px;color:#6d7074;font-size:16px}
.dots{display:flex;gap:7px;margin-top:17px}
.dot{width:11px;height:11px;border-radius:50%}
.dot:nth-child(1){background:var(--navy)}.dot:nth-child(2){background:var(--yellow)}.dot:nth-child(3){background:var(--teal)}.dot:nth-child(4){background:var(--navy)}
.actions{display:grid;gap:12px;margin-top:18px}
.btn{width:100%;border:0;border-radius:16px;padding:16px 18px;font-size:18px;font-weight:750;display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;cursor:pointer}
.primary{background:var(--navy);color:#fff;box-shadow:0 8px 20px rgba(11,63,120,.18)}
.secondary{background:#fff;color:var(--navy);border:1.5px solid #cfdae6}
.minirow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.small{font-size:15px;padding:13px 12px}
.hint{text-align:center;color:#8a8e93;font-size:13px;line-height:1.55;margin:14px 8px 0}
@media(max-width:390px){
  .card{padding:28px 22px 22px;border-radius:24px}
  .top{gap:12px}
  .name-cn{font-size:27px;letter-spacing:.06em}
  .name-en{font-size:17px}
  .role{font-size:17px;letter-spacing:.08em}
  .brand-lockup{width:138px;flex-basis:138px}
  .brand-zh{font-size:15px}
  .profile-photo{width:132px;height:132px;border-radius:20px;margin-top:20px}
  .contact{font-size:16px}
}
</style>
</head>
<body>
<main class="wrap"><section class="card">
<div class="top"><div class="identity"><div class="name-cn">洪彣欣</div><div class="name-en">Carol</div><div class="role">董事總經理</div><div class="role" style="margin-top:6px;font-size:17px">商周專欄作家</div></div><div class="brand-lockup">
    <img class="logo-img" src="carewell-logo.jpg" alt="carewell">
    <div class="brand-zh" aria-label="怡東人事顧問">
      <span>怡</span><span>東</span><span>人</span><span>事</span><span>顧</span><span>問</span>
    </div>
  </div></div>
<img class="profile-photo" src="carol-contact.jpg" alt="洪彣欣 Carol">
<div class="divider"></div>
<div class="contact">
<div><span class="label">Tel</span><a href="tel:+886227130166">+886 2 2713 0166 <span style="white-space:nowrap">ext 810</span></a></div>
<div><span class="label">Email</span><a href="mailto:carol.hong@carewell.com.tw">carol.hong@carewell.com.tw</a></div>
</div>
<div class="website"><a href="https://www.carewell.tw/" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">www.carewell.tw</a></div>
<div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
<div class="actions">

<a class="btn" style="background:#06C755;color:#fff" href="https://line.me/ti/p/8FFBm5fjsE" target="_blank" rel="noopener">加入我的 LINE 好友</a>
<div class="minirow"><a class="btn secondary small" href="tel:+886227130166">撥打公司</a><a class="btn secondary small" href="mailto:carol.hong@carewell.com.tw">寄 Email</a></div>
<button class="btn secondary" id="shareBtn" type="button">分享這張名片</button>
</div>
<p class="hint">iPhone：點「加入聯絡人」後開啟 vCard，再選「新增聯絡人」。<br>Android：開啟 vCard 後可匯入聯絡人。</p>
</section></main>
<script>
document.getElementById('shareBtn').addEventListener('click',async()=>{const data={title:'洪彣欣 Carol｜Carewell',text:'洪彣欣 Carol｜Carewell 怡東顧問',url:location.href};try{if(navigator.share){await navigator.share(data)}else{await navigator.clipboard.writeText(location.href);alert('名片網址已複製')}}catch(e){}});
</script>
</body></html>
