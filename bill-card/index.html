<style>
:root{--navy:#0b3f78;--gray:#54565a;--line:#e6e8eb;--teal:#2d9da2;--yellow:#f2b126;--bg:#f6f7f9}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--gray)}
body{min-height:100vh;padding:24px 14px 40px}.wrap{max-width:560px;margin:0 auto}.card{background:#fff;border-radius:28px;box-shadow:0 14px 40px rgba(15,40,70,.09);padding:34px 28px 26px;border:1px solid #eef0f2}
.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.name-cn{font-size:34px;letter-spacing:.17em;font-weight:450;color:#5b5d60;line-height:1.15}.name-en{margin-top:9px;font-size:18px;letter-spacing:.24em;color:#56585c}
.role{margin-top:18px;font-size:20px;letter-spacing:.19em;line-height:1.65}.role-en{font-size:15px;letter-spacing:.22em;color:#66696d}.logo{font-weight:800;font-style:italic;color:var(--navy);font-size:38px;letter-spacing:-.04em;white-space:nowrap;margin-top:-4px}
.brand-lockup{width:178px;flex:0 0 178px;display:flex;flex-direction:column;align-items:stretch}.logo-img{display:block;width:100%;height:auto;object-fit:contain}.brand-zh{margin-top:5px;width:100%;display:flex;justify-content:space-between;align-items:center;color:#5b5d60;font-size:18px;font-weight:400;line-height:1.15;white-space:nowrap}.brand-zh span{display:block}\n.profile-photo{display:block;width:156px;height:156px;object-fit:cover;object-position:center 30%;border-radius:22px;margin:22px auto 4px;box-shadow:0 8px 24px rgba(15,40,70,.12)}
.divider{height:1px;background:var(--line);margin:28px 0 22px}.contact{display:grid;gap:10px;font-size:17px;line-height:1.35}.contact a{color:inherit;text-decoration:none}.label{font-weight:700;color:#4d4f53;min-width:70px;display:inline-block}
.website{margin-top:18px;color:#6d7074;font-size:16px}.dots{display:flex;gap:7px;margin-top:17px}.dot{width:11px;height:11px;border-radius:50%}.dot:nth-child(1){background:var(--navy)}.dot:nth-child(2){background:var(--yellow)}.dot:nth-child(3){background:var(--teal)}.dot:nth-child(4){background:var(--navy)}
.actions{display:grid;gap:12px;margin-top:18px}.btn{width:100%;border:0;border-radius:16px;padding:16px 18px;font-size:18px;font-weight:750;display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;cursor:pointer}.primary{background:var(--navy);color:#fff;box-shadow:0 8px 20px rgba(11,63,120,.18)}.secondary{background:#fff;color:var(--navy);border:1.5px solid #cfdae6}.linebtn{background:#06C755;color:#fff}.minirow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.small{font-size:15px;padding:13px 12px}.hint{text-align:center;color:#8a8e93;font-size:13px;line-height:1.55;margin:14px 8px 0}
@media(max-width:390px){.card{padding:28px 22px 22px;border-radius:24px}.top{gap:12px}.identity{min-width:0;flex:1 1 auto}.name-cn{font-size:27px;letter-spacing:.06em;white-space:nowrap}.name-en{font-size:17px;white-space:nowrap}.role{font-size:17px;letter-spacing:.08em;white-space:nowrap}.brand-lockup{width:138px;flex:0 0 138px}.brand-zh{width:138px;font-size:15px;font-weight:400;color:#5b5d60}.profile-photo{width:132px;height:132px;border-radius:20px;margin-top:20px}.contact{font-size:16px}}
</style>
